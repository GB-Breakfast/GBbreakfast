<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات غبور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one narrow phone-first column under a sticky red signage bar with a yellow rule (the shop's menu colors).
   Admin tabs widen the column for tables. Big tappable chips, one primary action per card. */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --soft:#F3EEE7; --ink:#241815; --muted:#6B5E57; --line:#E3DBD1;
  --head:#C8191E; --head-ink:#FFFFFF; --red:#C8191E; --on-red:#FFFFFF; --accent-text:#B3141A;
  --yellow:#FFC629; --on-yellow:#3A2A00; --sel:#FFF1C2;
  --warn-bg:#FFF1C2; --warn-fg:#5B3A00; --bad-bg:#FDE7E5; --bad-fg:#8A1510; --ok:#1D7A4B;
  --f-display:'Lalezar','Tajawal','Tahoma',system-ui,sans-serif;
  --f-body:'Tajawal','Tahoma',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171110; --surface:#221917; --soft:#2C2220; --ink:#F7EEE8; --muted:#B8A89F; --line:#3E302C;
    --head:#A5161B; --head-ink:#FFFFFF; --red:#D92D32; --on-red:#FFFFFF; --accent-text:#FF8A84;
    --yellow:#FFC629; --on-yellow:#3A2A00; --sel:#4A3A12;
    --warn-bg:#4A3A12; --warn-fg:#FFE08A; --bad-bg:#4A1B18; --bad-fg:#FFB4AD; --ok:#5BD08F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171110; --surface:#221917; --soft:#2C2220; --ink:#F7EEE8; --muted:#B8A89F; --line:#3E302C;
  --head:#A5161B; --head-ink:#FFFFFF; --red:#D92D32; --on-red:#FFFFFF; --accent-text:#FF8A84;
  --yellow:#FFC629; --on-yellow:#3A2A00; --sel:#4A3A12;
  --warn-bg:#4A3A12; --warn-fg:#FFE08A; --bad-bg:#4A1B18; --bad-fg:#FFB4AD; --ok:#5BD08F;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1000px}
header.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);border-bottom:4px solid var(--yellow)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-name{font:400 28px/1 var(--f-display);white-space:nowrap}
.brand-sub{font-size:13px;opacity:.92}
.who{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:8em;display:inline-block;vertical-align:bottom}
.who .link{font:inherit;font-size:13px;font-weight:700;background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer}
.badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.plate{background:var(--yellow);color:var(--on-yellow)}
.badge.adm{background:var(--yellow);color:var(--on-yellow)}
main{padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:400 22px/1.25 var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.lbl{font-weight:800;font-size:14px;color:var(--muted);margin-bottom:6px}
.field{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;padding:8px 14px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--red)}
.chip .pr{font-size:13px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-weight:800;padding:10px;min-height:48px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.seg button+button{border-inline-start:2px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row .grow{flex:1 1 180px;min-width:0}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{font:inherit;font-weight:800;font-size:22px;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.stepper output{font:400 26px/1 var(--f-display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input[type=number]{text-align:center}
input.need{border-color:#E08A00}
textarea{font:inherit;width:100%;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px}
.preview{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.preview .nm{font:400 24px/1.25 var(--f-display)}
.preview .pz{font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:800;border-radius:12px;border:2px solid transparent;padding:10px 18px;min-height:48px;cursor:pointer;background:var(--red);color:var(--on-red)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.small{min-height:38px;padding:5px 12px;font-size:14px}
.btn:disabled,.chip:disabled,.seg button:disabled,.stepper button:disabled{opacity:.45;cursor:not-allowed}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-block:10px;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.qty{font:400 26px/1.1 var(--f-display);color:var(--accent-text);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.lt{font-weight:800}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pz{font-weight:800;font-variant-numeric:tabular-nums}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-weight:800}
.totalrow .big{font:400 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.note{border-radius:12px;padding:12px 14px;font-weight:700}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:800;background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.sechead{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:18px;border-top:4px solid var(--yellow)}
.sechead h2{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:12px;padding:12px;min-width:0}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.tile b{font:400 30px/1.15 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:0 6px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daynav .dl{font:400 22px/1.2 var(--f-display)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.agg{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
.agg .c{font:400 30px/1.05 var(--f-display);color:var(--accent-text);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.agg .d{padding-bottom:10px;border-bottom:1px dashed var(--line);min-width:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.person header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person h3{margin:0;font:400 20px/1.2 var(--f-display);overflow-wrap:anywhere}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.pl span:first-child{min-width:0;overflow-wrap:anywhere}
.mitem{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px dashed var(--line)}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input[type=text]{flex:1 1 150px;width:auto}
.mrow input[type=number]{flex:0 0 96px;width:96px}
.mini{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mini input{flex:1}
.conf{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:2px solid var(--line)}
.addf input[name=n]{flex:1 1 150px;width:auto}
.addf input[name=p]{flex:0 0 96px;width:96px}
.addf input[name=ph]{flex:1 1 100%;width:auto}
.toast{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.28);max-width:100%}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="band">
    <div class="wrap bar" id="hwrap">
      <div class="brand"><span class="brand-name">طلبات غبور</span><span class="brand-sub">ساندوتشات النهاردة</span></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* الصق هنا إعدادات Firebase بتاعتك (firebaseConfig) بدل القيم اللي تحت */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAtmJ02BlOGygHRduRildW8wLlAbUhXOac",
  authDomain: "gb-gb-b6358.firebaseapp.com",
  projectId: "gb-gb-b6358",
  storageBucket: "gb-gb-b6358.firebasestorage.app",
  messagingSenderId: "765008472535",
  appId: "1:765008472535:web:d3dbb28282702daa054392"
};
</script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var KIND={sandwich:'ساندوتش',plate:'طلب'};
var BREAD=['بلدي','شامي','سوري'], SALAD=['بلدي','عادية','طحينة فقط'];

var db=null, userNs=null, dl=null, unsub={};
var S={
  name:'', nameDraft:'', editingName:false, focusName:false,
  today:ymd(), date:ymd(), tab:'order',
  isAdmin:false, canWrite:null, dbNull:false, err:null, slow:false,
  showLogin:false, loginErr:false, focusLogin:false, canWriteReal:null, mine:null, menu:[], menuReady:false, orders:[], ordersReady:false, meta:null,
  draft:{kind:'sandwich',typeId:null,extraId:null,bread:'بلدي',salad:'بلدي',qty:1,note:''},
  confirmDel:null, copyText:null, selectCopy:false, dirty:false
};

/* ---------- helpers ---------- */
function ymd(d){d=d||new Date();var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function shiftDate(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function dateLabel(s){try{return new Date(s+'T12:00:00').toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function cleanName(s){return String(s||'').trim().replace(/\s+/g,' ').slice(0,30)}
function hash(s){
  s=s.trim().replace(/\s+/g,' ').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
  var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return h.toString(16).padStart(8,'0');
}
function myDocId(){return S.today+'_'+hash(S.name)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function saladTxt(v){return v==='طحينة فقط'?v:'سلطة '+v}
function money(n){return String(Math.round(n*100)/100)}
function isNum(v){return typeof v==='number'&&isFinite(v)}
function isClosed(){return !!(S.meta&&S.meta.closed)}
function menuMap(){var m={};S.menu.forEach(function(x){m[x.id]=x});return m}
function byCat(cat){
  return S.menu.filter(function(m){return m.cat===cat}).sort(function(a,b){
    var d=(isNum(a.sort)?a.sort:1e9)-(isNum(b.sort)?b.sort:1e9);
    return d||String(a.name).localeCompare(String(b.name),'ar');
  });
}
function phraseOf(e){return (e.phrase&&String(e.phrase).trim())||((/^ال/.test(e.name)?'ب':'بال')+e.name)}
function labelOf(t,e){return t.name+(e?' '+phraseOf(e):'')}
function lineMoney(l,map){
  var t=map[l.typeId], e=l.extraId?map[l.extraId]:null;
  var tp=t&&isNum(t.price)?t.price:null, ep=e?(isNum(e.price)?e.price:null):0;
  var q=Math.max(1,Number(l.qty)||1);
  if(tp===null||ep===null) return {unit:null,total:0,qty:q};
  return {unit:tp+ep,total:(tp+ep)*q,qty:q};
}
function orderTotals(o,map){
  var r={qty:0,total:0,miss:0};
  (o.lines||[]).forEach(function(l){var m=lineMoney(l,map);r.qty+=m.qty;if(m.unit===null)r.miss+=m.qty;else r.total+=m.total});
  return r;
}
function sortedOrders(){return S.orders.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ar')})}
function aggregate(os){
  var m=new Map();
  os.forEach(function(o){(o.lines||[]).forEach(function(l){
    var q=Math.max(1,Number(l.qty)||1);
    var k=[l.kind,l.label,l.bread,l.salad,l.note||''].join('\u0001');
    var r=m.get(k)||{kind:l.kind,label:l.label,bread:l.bread,salad:l.salad,note:l.note||'',qty:0,who:[]};
    r.qty+=q;r.who.push(o.name+(q>1?' ×'+q:''));m.set(k,r);
  })});
  return Array.from(m.values()).sort(function(a,b){
    var ka=a.kind==='plate'?1:0,kb=b.kind==='plate'?1:0;
    return (ka-kb)||String(a.label).localeCompare(String(b.label),'ar');
  });
}
function breakdown(agg){
  var b={},s={},q=0;
  agg.forEach(function(r){if(r.bread){b[r.bread]=(b[r.bread]||0)+r.qty;s[r.salad]=(s[r.salad]||0)+r.qty}q+=r.qty});
  var f=function(o){return Object.keys(o).map(function(k){return k+' '+o[k]}).join(' · ')};
  return {qty:q,bread:f(b),salad:f(s)};
}
var tt;
function toast(m){var t=$('#toast');t.innerHTML='<span></span>';t.firstChild.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
var chain=Promise.resolve();
function errText(e,m){
  if(e&&e.code==='invalid_argument')return 'مش مسموح لك تعدّل. اطلب من الأدمن يشاركك بصلاحية «مشاركة»';
  if(e&&e.code==='quota_exceeded')return 'المساحة امتلأت';
  return m||'حصلت مشكلة، جرّب تاني';
}
function enqueue(fn,msg){chain=chain.then(fn).catch(function(e){toast(errText(e,msg))});return chain}

/* ---------- data ---------- */
function subMenu(){
  unsub.menu=db.collection('menu').onSnapshot(function(snap){
    S.menu=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    S.menuReady=true;S.slow=false;render();
  },function(e){S.err=e.code;render()});
}
function subDay(){
  if(unsub.orders)unsub.orders();if(unsub.meta)unsub.meta();
  S.ordersReady=false;S.orders=[];S.meta=null;
  unsub.orders=db.collection('orders').where('date','==',S.date).onSnapshot(function(snap){
    S.orders=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    S.ordersReady=true;render();
  },function(e){S.err=e.code;render()});
  unsub.meta=db.doc('meta/'+S.date).onSnapshot(function(s){S.meta=s.exists?s.data():null;render()},function(){});
}
function subMine(){
  if(unsub.mine){unsub.mine();unsub.mine=null}
  S.mine=null;
  if(!db||!S.name||S.editingName)return;
  unsub.mine=db.doc('orders/'+myDocId()).onSnapshot(function(sn){
    S.mine=sn.exists?Object.assign({},sn.data(),{id:sn.id}):null;render();
  },function(e){S.err=e.code;render()});
}
function setDate(d){
  if(!db){S.date=d;render(true);return}
  if(d===S.date&&unsub.orders){render(true);return}
  S.date=d;subDay();render(true);
}
function addLine(){
  var map=menuMap(),d=S.draft,t=map[d.typeId];
  if(!t||!S.name)return;
  if(isClosed()&&!S.isAdmin){toast('الطلبات اتقفلت');return}
  var e=d.extraId?map[d.extraId]:null;
  var line={id:uid(),kind:d.kind,typeId:t.id,extraId:e?e.id:null,label:labelOf(t,e),bread:d.kind==='plate'?null:d.bread,salad:d.kind==='plate'?null:d.salad,qty:d.qty,note:d.note.trim().slice(0,80)};
  var id=myDocId(),name=S.name,date=S.today;
  d.typeId=null;d.extraId=null;d.qty=1;d.note='';
  render(true);toast('اتضاف: '+line.label);
  enqueue(function(){
    var ref=db.doc('orders/'+id);
    return ref.get().then(function(snap){
      var cur=snap.exists?snap.data():{};
      var lines=(cur.lines||[]).map(function(x){return Object.assign({},x)});
      lines.push(line);
      return ref.set({date:date,name:name,lines:lines,updatedAt:Date.now()});
    });
  },'الطلب ماتسجلش، جرّب تاني');
}
function removeLine(lid){
  if(isClosed()&&!S.isAdmin){toast('الطلبات اتقفلت');return}
  var id=myDocId();
  enqueue(function(){
    var ref=db.doc('orders/'+id);
    return ref.get().then(function(s){
      if(!s.exists)return;
      var cur=Object.assign({},s.data());
      var lines=(cur.lines||[]).filter(function(x){return x.id!==lid}).map(function(x){return Object.assign({},x)});
      if(!lines.length)return ref.delete();
      cur.lines=lines;cur.updatedAt=Date.now();return ref.set(cur);
    });
  },'الحذف ماتمش، جرّب تاني');
}
function toggleClosed(){
  var c=!isClosed(),date=S.date;
  enqueue(function(){return db.doc('meta/'+date).set({closed:c})},'ماقدرتش أغيّر الحالة');
}

function seedMenu(){

function menuAdd(cat,name,price,phrase){

function saveFile(name,html){
  var w=null;
  try{w=window.open('','_blank')}catch(e){}
  if(w){w.document.open();w.document.write(html);w.document.close();toast('اتفتح ملف الطباعة في صفحة جديدة');return}
  try{
    var u=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    var l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();
    toast('اتحفظ الملف. افتحه وهتظهر الطباعة');
  }catch(e){toast('ماقدرتش أفتح ملف الطباعة')}
}
function copyAgg(){
  var text=aggText();
  var fallback=function(){S.copyText=text;S.selectCopy=true;render(true)};
  try{navigator.clipboard.writeText(text).then(function(){toast('اتنسخت. ابعتها على الواتساب')},fallback)}catch(e){fallback()}
}

/* ---------- render ---------- */
function render(force){
  var main=$('#main'),ae=document.activeElement;
  if(!force&&ae&&main.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)){S.dirty=true;return}
  S.dirty=false;
  var wide=false;
  main.className='wrap'+(wide?' wide':'');
  $('#hwrap').className='wrap bar'+(wide?' wide':'');
  $('#who').innerHTML=(S.name&&!S.editingName)?'<span>أهلاً <b>'+esc(S.name)+'</b></span>'+(S.isAdmin?'<span class="badge adm">أدمن</span>':'')+'<button type="button" class="link" data-act="chname">تغيير</button>'+(S.isAdmin?'<button type="button" class="link" data-act="adminout">خروج الأدمن</button>':''):'';
  var h;
  if(S.dbNull)h=viewNoDb();
  else if(!S.name||S.editingName)h=viewName();
  else{
    h=viewOrder();
    if(S.isAdmin)h+='<div class="sechead"><h2>لوحة الأدمن</h2><span class="badge adm">الطلبات والمنيو</span></div>'+viewOrders()+viewMenu();
  }
  main.innerHTML=h;
  var ni=$('#nameInput');if(ni&&S.focusName){ni.focus();S.focusName=false}
  var au=$('#adminU');if(au&&S.focusLogin){au.focus();S.focusLogin=false}
  var cb=$('#copyBox');if(cb&&S.selectCopy){cb.focus();cb.select();S.selectCopy=false}
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,d=S.draft;
  switch(a){
    case 'kind':d.kind=v;d.typeId=null;d.extraId=null;break;
    case 'type':{d.typeId=id;var m=menuMap();if(d.extraId&&m[d.extraId]&&m[id]&&m[d.extraId].name===m[id].name)d.extraId=null;break}
    case 'extra':d.extraId=id||null;break;
    case 'bread':d.bread=v;break;
    case 'salad':d.salad=v;break;
    case 'qty':d.qty=Math.min(50,Math.max(1,d.qty+Number(v)));break;
    case 'add':addLine();return;
    case 'rm':removeLine(id);return;
    case 'tab':S.tab=v;S.confirmDel=null;S.copyText=null;if(v==='order'){setDate(S.today);return}break;
    case 'seed':seedMenu();return;
    case 'showlogin':S.showLogin=true;S.loginErr=false;S.focusLogin=true;break;
    case 'adminout':S.isAdmin=false;lsSet('fn-admin','0');S.canWrite=S.canWriteReal;S.confirmDel=null;S.copyText=null;toast('خرجت من الأدمن');break;
    case 'chname':S.editingName=true;S.nameDraft=S.name;S.focusName=true;break;
    case 'day':setDate(shiftDate(S.date,Number(v)));return;
    case 'todaydate':setDate(S.today);return;
    case 'close':toggleClosed();return;
    case 'copy':copyAgg();return;
    case 'dl-agg':saveFile('orders-'+S.date+'.html',buildAggPrint());return;
    case 'dl-people':saveFile('accounts-'+S.date+'.html',buildPeoplePrint());return;
    case 'ask':S.confirmDel=id;break;
    case 'no':S.confirmDel=null;break;
    case 'delorder':S.confirmDel=null;enqueue(function(){return db.doc('orders/'+id).delete()},'الحذف ماتمش');break;
    case 'delitem':S.confirmDel=null;enqueue(function(){return db.doc('menu/'+id).delete()},'الحذف ماتمش');break;
    default:return;
  }
  render(true);
});
document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  if(f.dataset.form==='login'){
    var u=f.elements.u.value.trim(),pw=f.elements.p.value;
    if(u==='GB'&&pw==='GB'){S.isAdmin=true;S.canWrite=true;S.showLogin=false;S.loginErr=false;lsSet('fn-admin','1');toast('دخلت كأدمن')}
    else{S.loginErr=true;S.focusLogin=true}
    render(true);return;
  }
  if(f.dataset.form==='name'){
    var v=cleanName($('#nameInput').value);if(!v)return;
    S.name=v;lsSet('fn-name',v);S.editingName=false;S.nameDraft='';subMine();render(true);
  }else if(f.dataset.form==='add'){
    var fd=new FormData(f),n=String(fd.get('n')||'').trim().slice(0,40);if(!n)return;
    var ps=String(fd.get('p')||'').trim(),p=ps===''?null:Number(ps);if(p!==null&&(!isFinite(p)||p<0))p=null;
    menuAdd(f.dataset.cat,n,p,String(fd.get('ph')||'').trim().slice(0,60));
    f.reset();toast('اتضاف: '+n);
  }
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.f==='note')S.draft.note=el.value;
  if(el.id==='nameInput')S.nameDraft=el.value;
});
document.addEventListener('change',function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.mid)return;
  var id=el.dataset.mid,f=el.dataset.f,patch;
  if(f==='price'){var s=el.value.trim();var n=s===''?null:Number(s);patch={price:(n!==null&&isFinite(n)&&n>=0)?n:null}}
  else if(f==='name'){var nv=el.value.trim();if(!nv){render(true);return}patch={name:nv.slice(0,40)}}
  else if(f==='phrase'){patch={phrase:el.value.trim().slice(0,60)}}
  else return;
  menuUpdate(id,patch);
});
document.addEventListener('focusout',function(){
  setTimeout(function(){
    if(!S.dirty)return;var ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))return;
    render(true);
  },0);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden||!db)return;
  var t=ymd();if(t===S.today)return;
  var follow=S.date===S.today;S.today=t;subMine();
  if(follow||!S.isAdmin)setDate(t);else render(true);
});

/* ---------- start ---------- */
function init(){
  S.name=cleanName(lsGet('fn-name')||'');
  S.isAdmin=lsGet('fn-admin')==='1';
  S.editingName=true;S.nameDraft=S.name;S.focusName=true;
  render(true);
  var cfg=window.FIREBASE_CONFIG;
  if(typeof firebase==='undefined'||!cfg||/PASTE/.test(cfg.apiKey||'')){S.dbNull=true;S.setup=typeof firebase!=='undefined';render(true);return}
  try{
    firebase.initializeApp(cfg);
    db=firebase.firestore();
  }catch(e){S.dbNull=true;render(true);return}
  S.canWrite=true;S.canWriteReal=true;
  setTimeout(function(){if(!S.menuReady){S.slow=true;render()}},10000);
  subMenu();subDay();render(true);
}
init();
})();
</script>
</body>
</html>
