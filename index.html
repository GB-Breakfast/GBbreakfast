<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات غبور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one narrow phone-first column under a sunny yolk header bar. Cards on a pale sky ground; sunrise-orange primary buttons; navy ink. Icons are inline SVG strokes that follow the text color. */
:root{
  --bg:#F4F8FB; --surface:#FFFFFF; --soft:#E8F1F7; --ink:#14283B; --muted:#586B7C; --line:#D7E3EC;
  --head:#FFC93C; --head-ink:#14283B;
  --red:#D9480F; --on-red:#FFFFFF; --accent-text:#B33A09;
  --yellow:#FFC93C; --on-yellow:#2E2200; --sel:#FFF0C4;
  --warn-bg:#FFF0C4; --warn-fg:#5B3A00; --paid-bg:#D8F2E3; --paid-fg:#0F5132;
  --bad-bg:#FDE4DD; --bad-fg:#8A2308; --ok:#1D7A4B; --shadow:0 1px 2px rgba(20,40,59,.06),0 4px 14px rgba(20,40,59,.05);
  --f-display:'Lalezar','Tajawal','Tahoma',system-ui,sans-serif;
  --f-body:'Tajawal','Tahoma',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1923; --surface:#162534; --soft:#1E3346; --ink:#EAF2F8; --muted:#9DB2C4; --line:#2A4156;
    --head:#22384D; --head-ink:#FFD76B;
    --red:#F2733A; --on-red:#1A0E07; --accent-text:#FF9B6A;
    --yellow:#FFC93C; --on-yellow:#2E2200; --sel:#3A3216;
    --warn-bg:#40361A; --warn-fg:#FFE08A; --paid-bg:#1D4A34; --paid-fg:#B7F0CF;
    --bad-bg:#4A2217; --bad-fg:#FFB9A0; --ok:#5BD08F; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1923; --surface:#162534; --soft:#1E3346; --ink:#EAF2F8; --muted:#9DB2C4; --line:#2A4156;
  --head:#22384D; --head-ink:#FFD76B;
  --red:#F2733A; --on-red:#1A0E07; --accent-text:#FF9B6A;
  --yellow:#FFC93C; --on-yellow:#2E2200; --sel:#3A3216;
  --warn-bg:#40361A; --warn-fg:#FFE08A; --paid-bg:#1D4A34; --paid-fg:#B7F0CF;
  --bad-bg:#4A2217; --bad-fg:#FFB9A0; --ok:#5BD08F; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:2.4em;height:2.4em}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .sun{width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--red);display:grid;place-items:center;flex:none}
.brand .sun .ic{width:24px;height:24px}
.brand-name{font:400 26px/1 var(--f-display);white-space:nowrap}
.brand-sub{font-size:12.5px;opacity:.9;display:block;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;flex:1 1 150px;flex-wrap:wrap;justify-content:flex-end}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:7em;display:inline-block;vertical-align:bottom}
.who .link{font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.55);border:0;color:inherit;border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .who .link{background:rgba(255,255,255,.12)}}
:root[data-theme="dark"] .who .link{background:rgba(255,255,255,.12)}
.badge{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.badge .ic{width:1em;height:1em}
.badge.plate,.badge.adm{background:var(--yellow);color:var(--on-yellow)}
.badge.paid{background:var(--paid-bg);color:var(--paid-fg)}
.badge.unpaid{background:var(--warn-bg);color:var(--warn-fg)}
main{padding-block:16px 56px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
h2{font:400 22px/1.25 var(--f-display);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2 .ic{color:var(--red)}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.lbl{font-weight:800;font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.field{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;padding:8px 14px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--red)}
.chip .pr{font-size:13px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{font:inherit;font-weight:800;padding:10px 6px;min-height:48px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.seg button+button{border-inline-start:2px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row .grow{flex:1 1 180px;min-width:0}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{font:inherit;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.stepper output{font:400 26px/1 var(--f-display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],input[type=password]{font:inherit;padding:10px 12px;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input[type=number]{text-align:center}
input.need{border-color:#E08A00}
.inp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding-inline:12px;min-height:50px}
.inp:focus-within{border-color:var(--red)}
.inp .ic{color:var(--muted)}
.inp input{border:0;background:transparent;padding:10px 0;min-height:46px;outline:0;flex:1}
.inp .eye{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px}
textarea{font:inherit;width:100%;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--red);flex:none}
.chk .ic{color:var(--red)}
.preview{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.preview .nm{font:400 24px/1.25 var(--f-display)}
.preview .pz{font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:800;border-radius:14px;border:2px solid transparent;padding:10px 18px;min-height:48px;cursor:pointer;background:var(--red);color:var(--on-red);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.small{min-height:38px;padding:5px 12px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled,.chip:disabled,.seg button:disabled,.stepper button:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 10px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-block:10px;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.qty{font:400 26px/1.1 var(--f-display);color:var(--accent-text);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.lt{font-weight:800}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pz{font-weight:800;font-variant-numeric:tabular-nums}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-weight:800}
.totalrow .big{font:400 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.note{border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.note .ic{margin-top:3px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.note.debt{border:2px solid var(--red)}
.note .nb{display:flex;flex-direction:column;gap:3px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:14px;padding:12px;min-width:0}
.tile span{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.tile b{font:400 30px/1.15 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:0 6px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daynav .dl{font:400 22px/1.2 var(--f-display)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:6px}
.sec .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:8px 12px;font:400 20px/1.2 var(--f-display)}
.sec .sh .tot{font:800 15px var(--f-body);color:var(--accent-text)}
.agg{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
.agg .c{font:400 28px/1.05 var(--f-display);color:var(--accent-text);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.agg .d{padding-bottom:8px;border-bottom:1px dashed var(--line);min-width:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.person header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person h3{margin:0;font:400 20px/1.2 var(--f-display);overflow-wrap:anywhere}
.sum{font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.pl span:first-child{min-width:0;overflow-wrap:anywhere}
.mitem{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px dashed var(--line)}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input[type=text]{flex:1 1 150px;width:auto}
.mrow input[type=number]{flex:0 0 96px;width:96px}
.mini{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex:1 1 140px}
.mini input{flex:1}
.conf{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;flex-wrap:wrap}
.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:2px solid var(--line)}
.addf input[name=n]{flex:1 1 150px;width:auto}
.addf input[name=p]{flex:0 0 96px;width:96px}
.sechead{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:18px;border-top:4px solid var(--yellow)}
.sechead h2{font-size:26px}
.rline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rline .k{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:700}
.rname{font:400 22px/1.2 var(--f-display)}
.grp{display:flex;flex-direction:column;gap:8px}
.gh{font:inherit;font-weight:800;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:start}
.gh .gl{display:inline-flex;align-items:center;gap:10px;font-size:17px}
.gh .gl .ic{color:var(--red);width:1.4em;height:1.4em}
.gh[aria-expanded="true"]{border-color:var(--red);background:var(--sel)}
.gh .cnt{font-size:13px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.gitems{padding:10px 2px 6px;display:flex;flex-wrap:wrap;gap:8px}
.sumrows{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px dashed var(--line)}
.hello{align-items:stretch;text-align:center}
.hello .hero{width:72px;height:72px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;margin:0 auto}
.hello .hero .ic{width:42px;height:42px}
.hello h2{justify-content:center;font-size:28px}
.hello .chk{justify-content:center}
.stop{align-items:center;text-align:center}
.stop h2{justify-content:center}
.mastercard{border:2px solid var(--yellow)}
.toast{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.28);max-width:100%}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.gh{transition:background-color .12s,border-color .12s}}

.greet{padding:4px 2px 0}
.greet h2{font-size:28px;text-wrap:balance}
.greet p{margin-top:2px;font-size:16px}
.stopmsg{font-size:18px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;max-width:30em}

a.btn{text-decoration:none}
.btn.wa{background:#1fa855;color:#fff}
.tel{color:var(--accent-text);font-weight:800;text-decoration:underline}
select{font:inherit;min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.addf select{width:auto;flex:1 1 150px}
</style>
</head>

function calcDayFor(orders,meta){
  var rest=dayRestFor(meta),im=itemMap();
  var os=orders.filter(function(o){return (o.lines||[]).length&&o.confirmed!==false}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ar')});
  var n=os.length,share=shareOf(rest&&rest.delivery,n);
  var d={rest:rest,n:n,share:share,people:[],sub:0,grand:0,qty:0,miss:0,paid:0,im:im};
  os.forEach(function(o){
    var t=orderSub(o,rest,im),total=t.sub+share;
    d.people.push({o:o,qty:t.qty,sub:t.sub,miss:t.miss,share:share,total:total,paid:!!o.paid});
    d.sub+=t.sub;d.grand+=total;d.qty+=t.qty;d.miss+=t.miss;if(o.paid)d.paid++;
  });
  return d;
}
function aggregate(people){
  var m=new Map();
  people.forEach(function(p){(p.o.lines||[]).forEach(function(l){
    var q=qtyOf(l),k=[l.kind,l.label,l.bread,l.salad,l.note||''].join('\u0001');
    var r=m.get(k)||{kind:l.kind,label:l.label,bread:l.bread,salad:l.salad,note:l.note||'',qty:0,who:[]};
    r.qty+=q;r.who.push(p.o.name+(q>1?' ×'+q:''));m.set(k,r);
  })});
  return Array.from(m.values()).sort(function(a,b){return String(a.label).localeCompare(String(b.label),'ar')});
}
function sections(agg){
  var order=['بلدي','شامي'];
  agg.forEach(function(r){if(r.kind!=='plate'&&r.bread&&order.indexOf(r.bread)<0)order.push(r.bread)});
  var out=order.map(function(b){
    var rows=agg.filter(function(r){return r.kind!=='plate'&&r.bread===b});
    return {key:b,title:'عيش '+b,rows:rows,total:rows.reduce(function(s,r){return s+r.qty},0)};
  });
  var pl=agg.filter(function(r){return r.kind==='plate'||!r.bread&&r.kind!=='sandwich'});
  out.push({key:'plate',title:'أطباق',rows:pl,total:pl.reduce(function(s,r){return s+r.qty},0)});
  return out.filter(function(s){return s.rows.length});
}
function shortOrder(p){
  return (p.o.lines||[]).map(function(l){
    var q=qtyOf(l);
    return q+' '+l.label+(l.kind==='plate'?' (طبق)':l.bread==='بلدي'?' ب':l.bread==='شامي'?' ش':'');
  }).join('، ');
}

function addLine(){
  var im=itemMap(),d=S.draft,it=im[d.itemId];
  if(!it||!S.pk)return;
  if(S.banned&&!isStaff()){toast('طلباتك موقوفة');return}
  if(isConfirmed(S.mine)){toast('الطلب متأكد. دوس تعديل الطلب الأول');return}
  if(isClosed()&&!isStaff()){toast('الطلبات اتقفلت');return}
  var plate=d.kind==='plate';
  var line={id:uid(),itemId:it.id,label:it.name,kind:d.kind,bread:plate?null:d.bread,salad:plate?null:d.salad,qty:d.qty,note:d.note.trim().slice(0,80)};
  var id=myDocId(),name=S.name,pk=S.pk,date=S.today;
  d.itemId=null;d.qty=1;d.note='';
  render(true);toast('اتضاف: '+line.label);
  enqueue(function(){
    var ref=db.doc('orders/'+id);
    return ref.get().then(function(snap){
      var cur=snap.exists?snap.data():{};
      var lines=(cur.lines||[]).map(function(x){return Object.assign({},x)});
      lines.push(line);
      return ref.set(Object.assign({},cur,{date:date,name:name,pk:pk,lines:lines,paid:false,confirmed:false,updatedAt:Date.now()}));
    });
  },'الطلب ماتسجلش، جرّب تاني');
}
function removeLine(lid){
  if(isConfirmed(S.mine)){toast('الطلب متأكد. دوس تعديل الطلب الأول');return}
  if(isClosed()&&!isStaff()){toast('الطلبات اتقفلت');return}
  var id=myDocId();
  enqueue(function(){
    var ref=db.doc('orders/'+id);
    return ref.get().then(function(s){
      if(!s.exists)return;
      var cur=Object.assign({},s.data());
      var lines=(cur.lines||[]).filter(function(x){return x.id!==lid}).map(function(x){return Object.assign({},x)});
      if(!lines.length)return ref.delete();
      cur.lines=lines;cur.paid=false;cur.updatedAt=Date.now();return ref.set(cur);
    });
  },'الحذف ماتمش، جرّب تاني');
}
function setPaid(id,v){
  enqueue(function(){
    return db.doc('orders/'+id).update({paid:!!v}).then(function(){if(v)return autoUnban(id)});
  },'ماقدرتش أسجّل الدفع');
}
function autoUnban(orderId){
  return db.doc('orders/'+orderId).get().then(function(sn){
    if(!sn.exists)return;var pk=sn.data().pk;if(!pk)return;
    return db.doc('users/'+pk).get().then(function(us){
      if(!us.exists||!us.data().banned)return;
      return db.collection('orders').where('pk','==',pk).get().then(function(q){
        var today=ymd(),left=q.docs.filter(function(d){var o=d.data();return !o.paid&&isConfirmed(o)&&o.date<today});
        if(!left.length)return db.doc('users/'+pk).set({banned:false},{merge:true});
      });
    });
  });
}
function setConfirmed(v){
  var id=myDocId();
  enqueue(function(){var patch={confirmed:v,updatedAt:Date.now()};return db.doc('orders/'+id).update(patch)},v?'ماقدرتش أأكد الطلب':'ماقدرتش أفتح الطلب للتعديل');
  toast(v?'اتأكد طلبك ✅':'تقدر تعدّل طلبك دلوقتي');
}
function setBan(pk,v){enqueue(function(){return db.doc('users/'+pk).set({banned:!!v},{merge:true})},'ماقدرتش أعمل الحظر');toast(v?'اتحظر':'اتفك الحظر')}
function setMeta(patch){var date=S.date;enqueue(function(){return db.doc('meta/'+date).set(patch,{merge:true})},'ماقدرتش أحفظ')}
function seedAll(){
  var b=db.batch(),ids=[];
  SEED_RESTS.forEach(function(n,i){var id='r'+(i+1);ids.push(id);b.set(db.doc('rests/'+id),{name:n,bread:SEED_BREAD,delivery:SEED_DELIVERY,sort:i+1})});
  var k=0;
  GROUPS.forEach(function(g){
    (SEED_ITEMS[g[0]]||[]).forEach(function(x,i){
      k++;var pr={};ids.forEach(function(r){pr[r]=x[1]});
      b.set(db.doc('items/i'+String(k).padStart(3,'0')),{name:x[0],group:g[0],sort:i+1,prices:pr});
    });
  });
  enqueue(function(){return b.commit()},'ماقدرتش أحمّل المنيو');
  toast('بنحمّل المنيو والمطاعم');
}
function addRest(name,bread,delivery,src){
  var mx=0;S.rests.forEach(function(r){if(isNum(r.sort)&&r.sort>mx)mx=r.sort});
  var id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),b=db.batch();
  b.set(db.doc('rests/'+id),{name:name,bread:bread,delivery:delivery,sort:mx+1,phone:''});
  if(src)S.items.forEach(function(it){if(it.prices&&isNum(it.prices[src])){var pt={};pt['prices.'+id]=it.prices[src];b.update(db.doc('items/'+it.id),pt)}});
  S.editRest=id;
  enqueue(function(){return b.commit()},'المطعم ماتضافش');
  toast('اتضاف مطعم: '+name);
}
function addItem(group,name,price){
  var mx=0;S.items.forEach(function(m){if(m.group===group&&isNum(m.sort)&&m.sort>mx)mx=m.sort});
  var pr={};S.rests.forEach(function(r){pr[r.id]=price});
  var id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  enqueue(function(){return db.doc('items/'+id).set({name:name,group:group,sort:mx+1,prices:pr})},'الصنف ماتضافش');
}

/* ---------- login ---------- */
function tryLogin(u,p,cb){
  var h=credHash(u,p);
  if(u===MASTER_U&&h===MASTER_H){cb('master');return}
  var fin=function(a){
    var ah=a.adminH||credHash(DEF_ADMIN_U,DEF_ADMIN_P),oh=a.orgH||credHash(DEF_ORG_U,DEF_ORG_P);
    cb(h===ah?'admin':h===oh?'org':null);
  };
  if(!db){fin({});return}
  db.doc('settings/auth').get().then(function(s){fin(s.exists?s.data():{})}).catch(function(){fin({})});
}

/* ---------- debts (تنبيه الدفع) ---------- */
var debtT=null;
function scheduleDebts(){clearTimeout(debtT);debtT=setTimeout(refreshDebts,400)}
function refreshDebts(){
  if(!db||!S.pk||!S.restsReady||!S.itemsReady)return;
  var n=nowD(),today=ymd(n),hour=n.getHours();
  var mine=S.myAll.filter(function(o){return !o.paid&&isConfirmed(o)&&(o.date<today||(o.date===today&&hour>=S.remindHour))});
  if(!mine.length){if(S.debts.length){S.debts=[];render()}return}
  Promise.all(mine.map(function(o){
    var get=(o.date===S.date)?Promise.resolve({orders:S.orders,meta:S.meta}):
      Promise.all([db.doc('meta/'+o.date).get(),db.collection('orders').where('date','==',o.date).get()]).then(function(r){
        return {meta:r[0].exists?r[0].data():null,orders:r[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})})};
      });
    return get.then(function(x){
      var c=calcDayFor(x.orders,x.meta),p=null;
      c.people.forEach(function(q){if(q.o.id===o.id)p=q});
      return {date:o.date,total:p?p.total:0,miss:p?p.miss:0,org:(x.meta&&x.meta.organizer)||''};
    });
  })).then(function(ds){S.debts=ds.sort(function(a,b){return a.date<b.date?-1:1});render()}).catch(function(){});
}
function debtBanner(){
  if(!S.debts.length)return '';
  return '<div class="note bad debt">'+ic('bell')+'<div class="nb"><b>لسه ماتدفعش حسابك</b>'+S.debts.map(function(x){
    return '<div>'+money(x.total)+' ج عن '+esc(dateLabel(x.date))+(x.miss?' (وفيه أصناف بدون سعر)':'')+(x.org?' — ادفع لـ '+esc(x.org):'')+'</div>';
  }).join('')+'</div></div>';
}

function orderText(d){
  var agg=aggregate(d.people),secs=sections(agg),all=0;
  var L=['طلبات غبور — '+dateLabel(S.date)];
  if(d.rest)L.push('المطعم: '+d.rest.name);
  secs.forEach(function(s){
    L.push('');L.push('— '+s.title+' —');
    s.rows.forEach(function(r){L.push(r.qty+' × '+r.label+(r.bread?' — '+saladTxt(r.salad):'')+(r.note?' — '+r.note:''))});
    L.push('إجمالي '+(s.key==='plate'?'الأطباق':'عيش '+s.key)+': '+s.total);all+=s.total;
  });
  L.push('');L.push('الإجمالي: '+all);
  return L.join('\n');
}
function accountsText(d){
  var L=['حساب '+dateLabel(S.date)+(d.rest?' — '+d.rest.name:''),''];
  d.people.forEach(function(p){
    L.push(p.o.name+': '+shortOrder(p)+' — '+money(p.total)+' ج — '+(p.paid?'✅ مدفوع':'❌ لم يدفع')+(p.miss?' (فيه صنف بدون سعر)':''));
  });
  L.push('');L.push('الإجمالي: '+money(d.grand)+' ج — المدفوع '+d.paid+' من '+d.n);
  return L.join('\n');
}

function render(force){
  var main=$('#main'),ae=document.activeElement;
  if(!force&&ae&&ae.id==='phoneInput'&&!ae.value){S.focusName=true}
  else if(!force&&ae&&main.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)){S.dirty=true;return}
  S.dirty=false;
  var named=!!(S.name&&S.pk);
  var who='';
  if(named)who+='<span>أهلاً <b>'+esc(S.name)+'</b></span>';
  if(isStaff())who+='<span class="badge adm">'+ic(isMaster()?'crown':isAdmin()?'shield':'clip')+roleName()+'</span>';
  if(named||isStaff())who+='<button type="button" class="link" data-act="logout">'+ic('logout')+'خروج</button>';
  $('#who').innerHTML=who;
  var h;
  if(S.dbNull)h=viewNoDb();
  else if(S.site.stopped&&!isMaster())h=viewStopped();
  else if(!named){h=viewPhone();if(isStaff())h+=staffPanel()}
  else{
    h=debtBanner()+greetBlock()+((S.banned&&!isStaff())?viewBanned():viewOrder());
    if(isStaff())h+=staffPanel();
  }
  main.innerHTML=h;
  var ni=$('#phoneInput');if(ni&&S.focusName){ni.focus();S.focusName=false}
  var au=$('#adminU');if(au&&S.focusLogin){au.focus();S.focusLogin=false}
  var cb=$('#copyBox');if(cb&&S.selectCopy){cb.focus();cb.select();S.selectCopy=false}
}
function staffPanel(){
  var d=calcDay();
  var h='<div class="sechead"><h2>'+ic(isMaster()?'crown':isAdmin()?'shield':'clip')+'لوحة '+roleName()+'</h2></div>';
  if(isMaster())h+=viewMaster()+viewUsers();

document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  var k=f.dataset.form;
  if(k==='login'){
    var u=f.elements.u.value.trim(),pw=f.elements.p.value;
    tryLogin(u,pw,function(role){
      if(role){S.role=role;lsSet('fn-role',role);S.showLogin=false;S.loginErr=false;S.showPass=false;toast('دخلت كـ'+roleName());if(!S.name)S.focusName=true;ensureUsersSub()}
      else{S.loginErr=true;S.focusLogin=true}
      render(true);
    });
    return;
  }
  if(k==='phone'){
    var raw=$('#phoneInput').value;S.phoneDraft=raw;S.remember=$('#rememberMe').checked;
    var ph=normPhone(raw);
    if(!ph){S.phoneErr='اكتب رقم موبايل صحيح (11 رقم).';render(true);return}
    var key=phoneKey(ph);
    db.doc('users/'+key).get().then(function(sn){
      if(!sn.exists){S.phoneErr='الرقم ده مش مسجّل. كلّم الكريتور يضيفه.';S.focusName=true;render(true);return}
      loginUser(key,sn.data().name);
    }).catch(function(){S.phoneErr='مش قادر أوصل لقاعدة البيانات، جرّب تاني.';render(true)});
    return;

    var un=f.elements.n.value.trim().slice(0,40),up=normPhone(f.elements.p.value);
    if(!un){toast('اكتب الاسم');return}
    if(!up){toast('اكتب رقم موبايل صحيح (11 رقم)');return}
    addUsers([{name:un,phone:up}]);f.reset();
  }else if(k==='addrest'){
    var rn=f.elements.n.value.trim().slice(0,30);if(!rn){toast('اكتب اسم المطعم');return}
    addRest(rn,numOrNull(f.elements.b.value)||0,numOrNull(f.elements.d.value)||0,f.elements.s.value);f.reset();
  }else if(k==='bulk'){
    var list=parseUsers($('#bulkTxt').value);
    if(!list.length){toast('مافهمتش الأسماء. اكتب الاسم وتحته رقمه');return}
    addUsers(list);$('#bulkTxt').value='';
  }else if(k==='additem'){
    var fd=new FormData(f),n=String(fd.get('n')||'').trim().slice(0,50);if(!n)return;
    addItem(f.dataset.group,n,numOrNull(fd.get('p')||''));
    f.reset();toast('اتضاف: '+n);
  }else if(k==='orgname'){
    var oph=f.elements.ph.value.trim(),opn=oph?normPhone(oph):'';
    if(oph&&!opn){toast('رقم المنظم مش صحيح (11 رقم)');return}
    setMeta({organizer:f.elements.n.value.trim().slice(0,30),orgPhone:opn||''});toast('اتحفظ بيانات المنظم');
  }else if(k==='remind'){
    var hv=Number(f.elements.h.value);if(!isFinite(hv)||hv<0||hv>23){toast('اكتب ساعة من 0 لـ 23');return}
    S.remindHour=Math.floor(hv);enqueue(function(){return db.doc('settings/main').set({remindHour:S.remindHour},{merge:true})},'ماقدرتش أحفظ');
    toast('اتحفظ وقت التنبيه');scheduleDebts();
  }else if(k==='cred'){
    var role=f.dataset.role,cu=f.elements.u.value.trim(),cp=f.elements.p.value.trim();
    if(!cu||!cp){toast('اكتب اليوزر والباسورد');return}
    if(cp.length<3){toast('الباسورد قصير');return}
    var patch={};patch[role==='admin'?'adminH':'orgH']=credHash(cu,cp);
    enqueue(function(){return db.doc('settings/auth').set(patch,{merge:true})},'ماقدرتش أحفظ');
    f.reset();toast('اتغيّر يوزر وباسورد '+(role==='admin'?'الأدمن':'المنظم'));
  }
});

function ensureUsersSub(){
  if(!db)return;
  if(isStaff()&&!unsub.users){
    unsub.users=db.collection('users').onSnapshot(function(snap){S.users=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});render()},function(){});
    unsub.late=db.collection('orders').where('paid','==',false).onSnapshot(function(snap){
      S.lateOrders=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});scheduleLate();
    },function(){});
  }else if(!isStaff()&&unsub.users){unsub.users();unsub.users=null;S.users=[];if(unsub.late){unsub.late();unsub.late=null}S.lateOrders=[];S.late=[]}
}
var lateT=null;
function scheduleLate(){clearTimeout(lateT);lateT=setTimeout(computeLate,500)}
function computeLate(){
  if(!db||!isStaff()||!S.restsReady||!S.itemsReady)return;
  var today=ymd(),os=S.lateOrders.filter(function(o){return isConfirmed(o)&&o.date<today});
  if(!os.length){if(S.late.length){S.late=[];render()}return}
  var dates=[];os.forEach(function(o){if(dates.indexOf(o.date)<0)dates.push(o.date)});
  Promise.all(dates.map(function(dt){
    return Promise.all([db.doc('meta/'+dt).get(),db.collection('orders').where('date','==',dt).get()]).then(function(r){
      return {date:dt,meta:r[0].exists?r[0].data():null,orders:r[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})})};
    });
  })).then(function(days){
    var by={};
    days.forEach(function(x){
      var c=calcDayFor(x.orders,x.meta);
      c.people.forEach(function(p){
        if(p.paid)return;
        var k=p.o.pk||p.o.name,e=by[k]||(by[k]={pk:p.o.pk,name:p.o.name,sum:0,rows:[]});
        e.sum+=p.total;e.rows.push({date:x.date,total:p.total,qty:p.qty,org:(x.meta&&x.meta.organizer)||'',orgPhone:(x.meta&&x.meta.orgPhone)||''});
      });
    });
    S.late=Object.keys(by).map(function(k){by[k].rows.sort(function(a,b){return a.date<b.date?-1:1});return by[k]}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ar')});
    render();
  }).catch(function(){});
}

  enqueue(function(){return b.commit()},'ماقدرتش أضيف');
  toast('اتضاف '+list.length+(list.length>1?' مستخدم':' مستخدم'));
}

  var cfg=window.FIREBASE_CONFIG;
  if(typeof firebase==='undefined'||!cfg||/PASTE/.test(cfg.apiKey||'')){S.dbNull=true;S.setup=typeof firebase!=='undefined';render(true);return}
  try{firebase.initializeApp(cfg);db=firebase.firestore()}catch(e){S.dbNull=true;render(true);return}
  if(rm==='1'&&pk){
    S.loginPending=true;
    db.doc('users/'+pk).get().then(function(sn){
      S.loginPending=false;
      if(sn.exists){S.pk=pk;S.name=sn.data().name;subMine()}else lsSet('fn-pk','');
      render(true);
    }).catch(function(){S.loginPending=false;render(true)});
  }
  render(true);
  loadSettings();setInterval(function(){loadSettings();scheduleDebts()},60000);
  setTimeout(function(){if(!S.restsReady||!S.itemsReady){S.slow=true;render()}},10000);
  subAll();subDay();ensureUsersSub();render(true);
}
init();
})();
</script>
</body>
